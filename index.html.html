<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة ومتابعة رش غرف الفنادق</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f1f5f9;
        }
        .room-card {
            transition: all 0.3s ease;
        }
        .room-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-emerald-600 p-2.5 rounded-xl text-white shadow-inner">
                    <i class="fa-solid fa-spray-can-sparkles text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">نظام متابعة رش غرف الفنادق</h1>
                    <p class="text-xs text-slate-400">مراقبة دورية لعمليات مكافحة الآفات والتعقيم</p>
                </div>
            </div>

            <!-- Global Action Buttons -->
            <div class="flex items-center gap-2 flex-wrap">
                <button onclick="openAddHotelModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-hotel"></i> إضافة فندق جديد
                </button>
                <button onclick="openAddRoomModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-door-open"></i> إضافة غرفة جديدة
                </button>
                <button onclick="resetAllData()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-3 py-2 rounded-xl text-xs border border-slate-700 transition" title="إعادة تعيين البيانات الافتراضية">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 flex flex-col gap-6">

        <!-- Notification Toast -->
        <div id="toast" class="fixed bottom-5 left-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-700">
            <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
            <span id="toastMessage" class="text-sm font-medium">تمت العملية بنجاح</span>
        </div>

        <!-- Hotel Selector & Filter Bar -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 w-full md:w-auto">
                <label for="hotelSelect" class="font-bold text-slate-700 whitespace-nowrap"><i class="fa-solid fa-building text-emerald-600 ml-1"></i> اختر الفندق:</label>
                <select id="hotelSelect" onchange="changeHotel(this.value)" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl focus:ring-emerald-500 focus:border-emerald-500 block p-2.5 min-w-[240px] font-semibold outline-none shadow-sm">
                    <!-- Dynamic Hotels -->
                </select>
                <button onclick="deleteCurrentHotel()" class="bg-red-50 hover:bg-red-100 text-red-600 p-2.5 rounded-xl border border-red-200 transition text-sm" title="حذف الفندق الحالي">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>

            <!-- Statistics & Search -->
            <div class="flex items-center gap-4 w-full md:w-auto justify-end flex-wrap">
                <div class="bg-emerald-50 text-emerald-800 px-3 py-1.5 rounded-xl text-xs font-bold border border-emerald-200 flex items-center gap-1.5">
                    <i class="fa-solid fa-check-circle"></i> تم الرش: <span id="statSprayed" class="text-sm font-extrabold">0</span>
                </div>
                <div class="bg-amber-50 text-amber-800 px-3 py-1.5 rounded-xl text-xs font-bold border border-amber-200 flex items-center gap-1.5">
                    <i class="fa-solid fa-triangle-exclamation"></i> بانتظار الرش: <span id="statPending" class="text-sm font-extrabold">0</span>
                </div>
                <div class="relative w-full sm:w-auto">
                    <input type="text" id="searchInput" oninput="renderRooms()" placeholder="بحث برقم أو نوع الغرفة..." class="bg-slate-50 border border-slate-300 text-sm rounded-xl pl-4 pr-10 py-2 w-full outline-none focus:border-emerald-500">
                    <i class="fa-solid fa-search absolute right-3.5 top-3 text-slate-400 text-xs"></i>
                </div>
            </div>
        </div>

        <!-- Rooms Grid Container -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex-grow">
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                <div>
                    <h2 id="currentHotelTitle" class="text-lg font-bold text-slate-800">قائمة الغرف والأجنحة</h2>
                    <p id="currentHotelSub" class="text-xs text-slate-500">اضغط على زر الرش لتحديث حالة التعقيم والغرفة فوراً</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="filterRooms('all')" id="filterAll" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white transition">الكل</button>
                    <button onclick="filterRooms('pending')" id="filterPending" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">لم ترش</button>
                    <button onclick="filterRooms('sprayed')" id="filterSprayed" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">تم الرش</button>
                </div>
            </div>

            <!-- Grid -->
            <div id="roomsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                <!-- Dynamic Rooms -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        جميع الحقوق محفوظة &copy; 2026 - نظام إدارة ومتابعة رش الفنادق
    </footer>

    <!-- Modal: Add Hotel -->
    <div id="hotelModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-slate-100 transform transition-all">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-hotel text-emerald-600 ml-2"></i> إضافة فندق جديد</h3>
                <button onclick="closeAddHotelModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">اسم الفندق / الفرع</label>
                    <input type="text" id="newHotelName" placeholder="مثال: فندق فخر ينبع 4" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-emerald-500">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button onclick="closeAddHotelModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl">إلغاء</button>
                    <button onclick="saveNewHotel()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl shadow">حفظ الفندق</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Add Room -->
    <div id="roomModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-slate-100 transform transition-all">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-door-open text-blue-600 ml-2"></i> إضافة غرفة أو جناح جديد</h3>
                <button onclick="closeAddRoomModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">رقم الغرفة</label>
                    <input type="text" id="newRoomNumber" placeholder="مثال: 110" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">نوع الغرفة</label>
                    <select id="newRoomType" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none focus:border-blue-500">
                        <option value="غرفة مزدوجة">غرفة مزدوجة</option>
                        <option value="غرفة مفردة">غرفة مفردة</option>
                        <option value="استوديو">استوديو</option>
                        <option value="جناح ملكي / داخلي">جناح داخلي / بإطلالة</option>
                        <option value="غرفتين وصالة">غرفتين وصالة</option>
                        <option value="سويت vip">سويت VIP</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button onclick="closeAddRoomModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl">إلغاء</button>
                    <button onclick="saveNewRoom()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl shadow">إضافة الغرفة</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Logic Script -->
    <script>
        // Default Initial Data based on provided Hotel UI samples
        const defaultHotelsData = [
            {
                id: "hotel_1",
                name: "فريق تيم الفندقية",
                rooms: [
                    { id: "r1", number: "1101", type: "غرفة مزدوجة", sprayed: true, sprayedTime: "2026-10-22 08:30 ص" },
                    { id: "r2", number: "1102", type: "غرفة مزدوجة", sprayed: false, sprayedTime: null },
                    { id: "r3", number: "1103", type: "غرفة مزدوجة", sprayed: true, sprayedTime: "2026-10-22 09:15 ص" },
                    { id: "r4", number: "1104", type: "سرين منفصلة", sprayed: false, sprayedTime: null },
                    { id: "r5", number: "1105", type: "غرفة مزدوجة", sprayed: true, sprayedTime: "2026-10-22 10:00 ص" },
                    { id: "r6", number: "1201", type: "غرفة مزدوجة", sprayed: false, sprayedTime: null },
                    { id: "r7", number: "1202", type: "غرفة مزدوجة", sprayed: true, sprayedTime: "2026-10-22 11:20 ص" },
                    { id: "r8", number: "1203", type: "غرفة مزدوجة", sprayed: true, sprayedTime: "2026-10-22 11:25 ص" }
                ]
            },
            {
                id: "hotel_2",
                name: "فندق فخر ينبع 1",
                rooms: [
                    { id: "fb1", number: "201", type: "استوديو", sprayed: true, sprayedTime: "2026-10-22 07:45 ص" },
                    { id: "fb2", number: "204", type: "استوديو", sprayed: false, sprayedTime: null },
                    { id: "fb3", number: "205", type: "إستوديو كبير", sprayed: true, sprayedTime: "2026-10-22 08:00 ص" },
                    { id: "fb4", number: "206", type: "غرفة نوم مع صالة vip", sprayed: true, sprayedTime: "2026-10-22 08:20 ص" },
                    { id: "fb5", number: "207", type: "استوديو vip", sprayed: false, sprayedTime: null },
                    { id: "fb6", number: "305", type: "استوديو", sprayed: false, sprayedTime: null }
                ]
            },
            {
                id: "hotel_3",
                name: "فندق فخر ينبع 3",
                rooms: [
                    { id: "f3_1", number: "900", type: "غرفة مزدوجة بإطلالة على البحر", sprayed: true, sprayedTime: "2026-10-22 06:30 ص" },
                    { id: "f3_2", number: "901", type: "غرفة مزدوجة بإطلالة", sprayed: true, sprayedTime: "2026-10-22 06:45 ص" },
                    { id: "f3_3", number: "902", type: "غرفة مزدوجة", sprayed: false, sprayedTime: null },
                    { id: "f3_4", number: "914", type: "غرفة مزدوجة", sprayed: false, sprayedTime: null },
                    { id: "f3_5", number: "915", type: "غرفة مزدوجة مطلة", sprayed: true, sprayedTime: "2026-10-22 07:10 ص" }
                ]
            },
            {
                id: "hotel_4",
                name: "فندق فخر ينبع 5",
                rooms: [
                    { id: "f5_1", number: "901", type: "جناح داخلي", sprayed: true, sprayedTime: "2026-10-22 08:00 ص" },
                    { id: "f5_2", number: "902", type: "جناح كونكت", sprayed: false, sprayedTime: null },
                    { id: "f5_3", number: "921", type: "جناح بإطلالة", sprayed: false, sprayedTime: null },
                    { id: "f5_4", number: "926", type: "جناح بإطلالة", sprayed: true, sprayedTime: "2026-10-22 09:30 ص" }
                ]
            }
        ];

        let hotelsData = JSON.parse(localStorage.getItem('hotels_pest_data')) || defaultHotelsData;
        let currentHotelId = hotelsData[0] ? hotelsData[0].id : null;
        let currentFilter = 'all';

        // Initialize Application
        window.onload = function() {
            populateHotelSelect();
            renderRooms();
        };

        // Save to LocalStorage
        function saveData() {
            localStorage.setItem('hotels_pest_data', JSON.stringify(hotelsData));
        }

        // Show Toast Notification
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = message;
            if(isError) {
                toastIcon.className = "fa-solid fa-circle-exclamation text-red-400 text-lg";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-lg";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Populate Hotel Dropdown
        function populateHotelSelect() {
            const select = document.getElementById('hotelSelect');
            select.innerHTML = '';
            hotelsData.forEach(hotel => {
                const option = document.createElement('option');
                option.value = hotel.id;
                option.textContent = hotel.name;
                if(hotel.id === currentHotelId) {
                    option.selected = true;
                }
                select.appendChild(option);
            });
        }

        // Change Current Hotel
        function changeHotel(hotelId) {
            currentHotelId = hotelId;
            renderRooms();
        }

        // Filter Rooms State
        function filterRooms(filter) {
            currentFilter = filter;
            ['all', 'pending', 'sprayed'].forEach(f => {
                const btn = document.getElementById(`filter${f.charAt(0).toUpperCase() + f.slice(1)}`);
                if(f === filter) {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white transition";
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition";
                }
            });
            renderRooms();
        }

        // Render Rooms Grid
        function renderRooms() {
            const grid = document.getElementById('roomsGrid');
            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            const hotel = hotelsData.find(h => h.id === currentHotelId);

            grid.innerHTML = '';

            if (!hotel) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">لا توجد فنادق مسجلة، يرجى إضافة فندق جديد.</div>`;
                updateStats(0, 0);
                return;
            }

            document.getElementById('currentHotelTitle').textContent = hotel.name;

            let rooms = hotel.rooms;

            // Apply Search Filter
            if (searchQuery) {
                rooms = rooms.filter(r => r.number.toLowerCase().includes(searchQuery) || r.type.toLowerCase().includes(searchQuery));
            }

            // Apply Status Filter
            if (currentFilter === 'pending') {
                rooms = rooms.filter(r => !r.sprayed);
            } else if (currentFilter === 'sprayed') {
                rooms = rooms.filter(r => r.sprayed);
            }

            let sprayedCount = hotel.rooms.filter(r => r.sprayed).length;
            let pendingCount = hotel.rooms.length - sprayedCount;
            updateStats(sprayedCount, pendingCount);

            if (rooms.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><i class="fa-solid fa-box-open text-3xl mb-2 block"></i>لا توجد غرف مطابقة للبحث أو الفلتر الحالي</div>`;
                return;
            }

            rooms.forEach(room => {
                const card = document.createElement('div');
                card.className = `room-card rounded-2xl p-4 border flex flex-col justify-between gap-3 relative shadow-sm ${
                    room.sprayed 
                    ? 'bg-emerald-50/70 border-emerald-300 text-emerald-900' 
                    : 'bg-white border-slate-200 text-slate-800'
                }`;

                // Top Badge Status
                const statusBadge = room.sprayed 
                    ? `<span class="bg-emerald-600 text-white text-[10px] px-2.5 py-0.5 rounded-full font-bold flex items-center gap-1"><i class="fa-solid fa-check"></i> تم الرش</span>`
                    : `<span class="bg-amber-500 text-white text-[10px] px-2.5 py-0.5 rounded-full font-bold flex items-center gap-1"><i class="fa-solid fa-clock"></i> لم ترش بعد</span>`;

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs font-bold text-slate-400">غرفة رقم</span>
                            <h3 class="text-xl font-black">${room.number}</h3>
                        </div>
                        ${statusBadge}
                    </div>

                    <div class="bg-white/60 p-2.5 rounded-xl border border-slate-100">
                        <p class="text-xs font-bold text-slate-600"><i class="fa-solid fa-tag text-slate-400 ml-1"></i> ${room.type}</p>
                        <p class="text-[11px] text-slate-500 mt-1"><i class="fa-regular fa-clock ml-1"></i> ${room.sprayedTime ? room.sprayedTime : 'لم يتم التسجيل بعد'}</p>
                    </div>

                    <div class="flex items-center gap-2 pt-1 border-t border-slate-100/80">
                        <button onclick="toggleRoomSpray('${room.id}')" class="flex-grow py-2 px-3 rounded-xl font-bold text-xs shadow-sm transition flex items-center justify-center gap-1.5 ${
                            room.sprayed 
                            ? 'bg-amber-100 hover:bg-amber-200 text-amber-800' 
                            : 'bg-emerald-600 hover:bg-emerald-700 text-white'
                        }">
                            <i class="fa-solid ${room.sprayed ? 'fa-rotate-left' : 'fa-spray-can-sparkles'}"></i>
                            ${room.sprayed ? 'إلغاء الرش' : 'تأكيد الرش'}
                        </button>
                        <button onclick="deleteRoom('${room.id}')" class="p-2 bg-slate-100 hover:bg-red-50 text-slate-400 hover:text-red-600 rounded-xl transition text-xs" title="حذف الغرفة">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateStats(sprayed, pending) {
            document.getElementById('statSprayed').textContent = sprayed;
            document.getElementById('statPending').textContent = pending;
        }

        // Toggle Room Spray Status with Current Timestamp
        function toggleRoomSpray(roomId) {
            const hotel = hotelsData.find(h => h.id === currentHotelId);
            const room = hotel.rooms.find(r => r.id === roomId);
            if (room) {
                room.sprayed = !room.sprayed;
                if (room.sprayed) {
                    const now = new Date();
                    room.sprayedTime = now.toLocaleDateString('ar-SA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    showToast(`تم تسجيل رش الغرفة رقم ${room.number} بنجاح`);
                } else {
                    room.sprayedTime = null;
                    showToast(`تم إلغاء حالة رش الغرفة رقم ${room.number}`);
                }
                saveData();
                renderRooms();
            }
        }

        // Hotel & Room Modals Management
        function openAddHotelModal() {
            document.getElementById('newHotelName').value = '';
            document.getElementById('hotelModal').classList.remove('hidden');
        }
        function closeAddHotelModal() {
            document.getElementById('hotelModal').classList.add('hidden');
        }
        function saveNewHotel() {
            const name = document.getElementById('newHotelName').value.trim();
            if (!name) {
                showToast('يرجى إدخال اسم الفندق', true);
                return;
            }
            const newId = 'hotel_' + Date.now();
            hotelsData.push({ id: newId, name: name, rooms: [] });
            currentHotelId = newId;
            saveData();
            populateHotelSelect();
            renderRooms();
            closeAddHotelModal();
            showToast(`تمت إضافة الفندق "${name}" بنجاح`);
        }

        function deleteCurrentHotel() {
            if (hotelsData.length <= 1) {
                showToast('لا يمكن حذف الفندق الأخير في النظام', true);
                return;
            }
            if (confirm('هل أنت متأكد من حذف هذا الفندق وجميع غرفه نهائياً؟')) {
                hotelsData = hotelsData.filter(h => h.id !== currentHotelId);
                currentHotelId = hotelsData[0].id;
                saveData();
                populateHotelSelect();
                renderRooms();
                showToast('تم حذف الفندق بنجاح');
            }
        }

        function openAddRoomModal() {
            document.getElementById('newRoomNumber').value = '';
            document.getElementById('roomModal').classList.remove('hidden');
        }
        function closeAddRoomModal() {
            document.getElementById('roomModal').classList.add('hidden');
        }
        function saveNewRoom() {
            const number = document.getElementById('newRoomNumber').value.trim();
            const type = document.getElementById('newRoomType').value;
            if (!number) {
                showToast('يرجى إدخال رقم الغرفة', true);
                return;
            }
            const hotel = hotelsData.find(h => h.id === currentHotelId);
            if (hotel.rooms.some(r => r.number === number)) {
                showToast('رقم الغرفة موجود مسبقاً في هذا الفندق', true);
                return;
            }
            hotel.rooms.push({
                id: 'room_' + Date.now(),
                number: number,
                type: type,
                sprayed: false,
                sprayedTime: null
            });
            saveData();
            renderRooms();
            closeAddRoomModal();
            showToast(`تمت إضافة الغرفة رقم ${number} بنجاح`);
        }

        function deleteRoom(roomId) {
            const hotel = hotelsData.find(h => h.id === currentHotelId);
            hotel.rooms = hotel.rooms.filter(r => r.id !== roomId);
            saveData();
            renderRooms();
            showToast('تم حذف الغرفة بنجاح');
        }

        function resetAllData() {
            if (confirm('هل تريد استعادة البيانات الافتراضية للفنادق والغرف؟')) {
                hotelsData = defaultHotelsData;
                currentHotelId = hotelsData[0].id;
                saveData();
                populateHotelSelect();
                renderRooms();
                showToast('تمت استعادة البيانات الافتراضية بنجاح');
            }
        }
    </script>
</body>
</html>
